modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
logoFile = "assets/${id}/icon.png"
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "UtherHel"
description = '''
Unifies similar effects from different mods to prevent duplication and improve compatibility.
'''

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "${loader}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "fzzy_config"
mandatory = true
versionRange = "[0.7.0,)"
ordering = "AFTER"
side = "BOTH"
