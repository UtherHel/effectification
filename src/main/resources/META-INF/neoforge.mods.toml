modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
logoFile = "assets/${id}/icon.png"
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "UtherHel"
description = '''
Unifies similar effects from different mods to prevent duplication and improve compatibility.
'''

[[mixins]]
config = "effectification.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${loader}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "fzzy_config"
type = "required"
versionRange = "[0.7.0,)"
ordering = "AFTER"
side = "BOTH"
