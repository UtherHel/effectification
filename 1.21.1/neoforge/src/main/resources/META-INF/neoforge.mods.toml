type = "required"
versionRange = "[21.1.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.effectification]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.effectification]]
modId = "architectury"
type = "required"
versionRange = "[13.0.6,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.effectification]]
modId = "fzzy_config"
type = "required"
versionRange = "[0.7.0,)"
ordering = "AFTER"
side = "BOTH"
