[[mods]]
logoFile = "assets/effectification/icon.png"
modId = "effectification"
version = "${version}"
displayName = "Effectification"
authors = "UtherHel"
description = '''
Unifies similar effects from different mods to prevent duplication and improve compatibility.
'''

[[mixins]]
config = "effectification.mixins.json"

[[dependencies.effectification]]
