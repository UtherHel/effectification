# See https://stonecutter.kikugie.dev/wiki/v2/reference/gradle-api/structured-properties
mod.id = "effectification"
mod.name = "Effectification"
mod.group = "dev.utherhel.effectification"
mod.version = "2.0.4"

publish.status = "stable"
publish.dry_run = false
publish.modrinth = true
publish.modrinth_id = "efENFWZV"
publish.curseforge = true
publish.curseforge_id = "1465387"
publish.github = true

deps.fabric_loader = "0.20.1"
loomx.loom_version = "1.20.0-alpha.31"
deps.mixin = "0.8.5"
# Fzzy Config is written in Kotlin; its API signatures need the stdlib on the compile classpath
deps.kotlin = "2.0.20"

# mod.mc_compat and mod.loader_compat go into fabric.mod.json / mods.toml / neoforge.mods.toml

["26.3"]
# List of releases to be marked compatible on Modrinth/Curseforge
mod.mc_releases = ["26.3"]

[fabric."26.3"]
mod.mc_compat = "26.3"
mod.loader_compat = ">=0.17"
deps.fabric_api = "0.166.2+26.3"
deps.fzzy_config = "0.7.7+fix3+26.3"

[neoforge."26.3"]
mod.mc_compat = "[26.3]"
mod.loader_compat = "[26.3,)"
deps.neo_loader = "26.3.0.115"
deps.fzzy_config = "0.7.7+fix3+26.3+neoforge"

