# dev/mt.py settings of Effectification (see dev/README.md)

# The everyday set: the active version on both of its loaders, the oldest (Forge), a Fzzy Config 0.5.9 version and
# the newest targets. `python dev/mt.py smoke "*"` runs every target.
default_targets = ["1.21.1-fabric", "1.21.1-neoforge", "1.20.1-forge", "1.20.6-neoforge", "26.3-fabric"]

# known-harmless log lines (regexes)
log_noise = []

# Bugs the scenes found, not fixed yet (reported as "known issue" warnings until then):
# - static_alias (Forge 1.20.1): /effect give <source id> fails. The alias is in Forge's registry (static_alias_lookup
#   passes, saved effects load as the target), but commands look ids up in the holders of Forge's NamespacedWrapper,
#   which do not follow registry aliases.
# - server_mappings_synced, visual_only_renamed_on_client (Forge 1.20.1, mp): the server's config never reaches the
#   client there (the client's file is not overwritten, onSyncClient never runs; Fzzy Config 0.7.7+1.20.1+forge), so
#   the client keeps its own mappings. On 1.21.1 the same scenes pass. Cause not found yet.
[known_failures]
"1.20.1-forge" = ["effects/static_alias$", "client/server_mappings_synced", "client/visual_only_renamed_on_client"]

# runtime mods besides the mod jar (published production jars): the mandatory dependencies of fabric.mod.json and
# (neoforge.)mods.toml, and Fzzy Config's Kotlin runtime (the newest one for the target's loader and version)
[runtime]
fabric = [
    "maven:net.fabricmc.fabric-api:fabric-api:${deps.fabric_api}",
    "maven:me.fzzyhmstrs:fzzy_config:${deps.fzzy_config}",
    "modrinth:fabric-language-kotlin:*",
]
neoforge = [
    "maven:me.fzzyhmstrs:fzzy_config:${deps.fzzy_config}",
    "modrinth:kotlin-for-forge:*",
]
forge = [
    "maven:me.fzzyhmstrs:fzzy_config:${deps.fzzy_config}",
    "modrinth:kotlin-for-forge:*",
]

# The scenes' mappings (selftest/Scenarios.java), as the server's config file in the format Fzzy Config writes. The
# client of an mp run gets only the static ones (files_client below): the rest must reach it with the config sync.
[files_server."*"]
"config/effectification/effectification.toml" = '''
version = 6

[debug]
logLevel = "WARNINGS"

[[staticMappings]]
sourceEffect = "modtest:ghost_effect"
targetEffect = "minecraft:glowing"
amplifierMultiplier = 1.0
onlyVisualChange = false
unidirectional = false
extraApplyEffectTick = ""
discardEffectTick = ""

