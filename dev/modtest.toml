discardEffectTick = ""

[[dynamicMappings]]
sourceEffect = "minecraft:hunger"
targetEffect = "minecraft:weakness"
amplifierMultiplier = 1.0
onlyVisualChange = false
unidirectional = true
extraApplyEffectTick = ""
discardEffectTick = ""

[[dynamicMappings]]
sourceEffect = "minecraft:luck"
targetEffect = "minecraft:luck"
