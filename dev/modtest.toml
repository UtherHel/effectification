# The client gets the server's static mappings only: they are registry aliases (@RequiresAction RESTART), so a
# client without them would get Fzzy Config's restart screen on joining and never reach the world. The dynamic
# mappings stay off the client: they must arrive with the config sync (ClientScenarios checks that).
[files_client."*"]
"config/effectification/effectification.toml" = '''
version = 6
dynamicMappings = []

[debug]
logLevel = "WARNINGS"

[[staticMappings]]
sourceEffect = "modtest:ghost_effect"
targetEffect = "minecraft:glowing"
amplifierMultiplier = 1.0
onlyVisualChange = false
unidirectional = false
extraApplyEffectTick = ""
discardEffectTick = ""

[[staticMappings]]
sourceEffect = "minecraft:bad_omen"
targetEffect = "minecraft:glowing"
amplifierMultiplier = 1.0
onlyVisualChange = false
unidirectional = false
extraApplyEffectTick = ""
discardEffectTick = ""
'''
